<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doha Recycle Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      /* ── Base & Dark Theme ── */
      html { scroll-behavior: smooth; }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex; flex-direction: column; align-items: center;
        padding: 0; margin: 0;
        background: linear-gradient(160deg, #0a0f0d 0%, #101a14 40%, #0d1117 100%);
        color: #e8e8e8; min-height: 100vh;
      }

      /* ── Header Bar ── */
      .site-header {
        width: 100%; padding: 1rem 2rem;
        background: rgba(20, 30, 24, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(76, 175, 80, 0.15);
        display: flex; justify-content: space-between; align-items: center;
        flex-wrap: wrap; gap: 0.75rem;
        position: sticky; top: 0; z-index: 1000;
      }
      .site-header h1 {
        margin: 0; font-size: 1.5rem; font-weight: 700;
        background: linear-gradient(135deg, #4caf50, #81c784, #a5d6a7);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .site-header h1 .emoji { -webkit-text-fill-color: initial; }

      /* ── Submit Button ── */
      .link-button {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 22px;
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        color: #fff; font-weight: 600; font-size: 0.9rem;
        text-decoration: none; border-radius: 50px;
        box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3), 0 0 0 0 rgba(76, 175, 80, 0.4);
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        position: relative; overflow: hidden;
      }
      .link-button::before {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
        opacity: 0; transition: opacity 0.3s;
      }
      .link-button:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 6px 25px rgba(76, 175, 80, 0.45), 0 0 20px rgba(76, 175, 80, 0.2);
      }
      .link-button:hover::before { opacity: 1; }
      .link-button:active { transform: translateY(0) scale(0.98); }

      /* ── Subtle pulse animation on the button ── */
      @keyframes pulse-ring {
        0% { box-shadow: 0 4px 15px rgba(76,175,80,0.3), 0 0 0 0 rgba(76,175,80,0.35); }
        70% { box-shadow: 0 4px 15px rgba(76,175,80,0.3), 0 0 0 10px rgba(76,175,80,0); }
        100% { box-shadow: 0 4px 15px rgba(76,175,80,0.3), 0 0 0 0 rgba(76,175,80,0); }
      }
      .link-button { animation: pulse-ring 2.5s ease-out infinite; }
      .link-button:hover { animation: none; }

      /* ── Main Container ── */
      .container {
        width: 100%; max-width: 1100px;
        background: rgba(22, 30, 25, 0.7);
        backdrop-filter: blur(8px);
        padding: 1.5rem 2rem 2rem;
        border-radius: 16px;
        border: 1px solid rgba(76, 175, 80, 0.1);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        margin: 1.5rem 1rem 2rem;
      }
      .container > h1 { display: none; } /* hidden; moved to header */
      .container > p {
        color: #a0b0a5; font-size: 1rem; margin: 0 0 0.5rem;
      }

      /* ── Sidebar & Search ── */
      .flex-wrapper { display: flex; gap: 20px; margin-top: 16px; }
      #sidebar { width: 300px; display: flex; flex-direction: column; gap: 12px; }

      #search-box {
        padding: 12px 16px; border: 1px solid rgba(76,175,80,0.25);
        border-radius: 10px; background: rgba(30, 40, 34, 0.8);
        color: #e0e0e0; font-size: 0.95rem; font-family: inherit;
        transition: all 0.3s; outline: none;
      }
      #search-box::placeholder { color: #6a7a6e; }
      #search-box:focus {
        border-color: #4caf50;
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15), 0 2px 10px rgba(76, 175, 80, 0.1);
      }

      #bin-list {
        list-style: none; padding: 0; margin: 0;
        max-height: 400px; overflow-y: auto;
        border: 1px solid rgba(76, 175, 80, 0.12);
        border-radius: 10px; background: rgba(20, 28, 22, 0.6);
      }
      #bin-list::-webkit-scrollbar { width: 6px; }
      #bin-list::-webkit-scrollbar-track { background: transparent; }
      #bin-list::-webkit-scrollbar-thumb { background: rgba(76,175,80,0.3); border-radius: 3px; }

      .bin-item {
        padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
        cursor: pointer; color: #b0c0b5; font-size: 0.9rem;
        transition: all 0.25s ease; position: relative;
        border-left: 3px solid transparent;
      }
      .bin-item:hover {
        background: rgba(76, 175, 80, 0.08);
        color: #e0f0e4;
        border-left-color: #4caf50;
        padding-left: 20px;
      }
      .bin-item:active { background: rgba(76,175,80,0.15); }

      /* ── Map ── */
      #map-container {
        flex-grow: 1; height: 700px; border-radius: 12px;
        overflow: hidden; border: 1px solid rgba(76, 175, 80, 0.15);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      #map { height: 100%; width: 100%; }

      /* ── Popup Styling ── */
      .bin-popup-img { width: 150px; display: block; margin-top: 5px; border-radius: 6px; }
      .leaflet-popup-content-wrapper {
        background: rgba(30, 42, 34, 0.95); color: #e0e0e0;
        border-radius: 10px; border: 1px solid rgba(76,175,80,0.2);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      }
      .leaflet-popup-tip { background: rgba(30, 42, 34, 0.95); }
      .leaflet-popup-content b { color: #81c784; }

      /* ── Footer ── */
      .site-footer {
        width: 100%; text-align: center; padding: 1.5rem;
        color: #5a6a5e; font-size: 0.8rem;
        border-top: 1px solid rgba(76,175,80,0.08);
      }
      .site-footer a { color: #4caf50; text-decoration: none; }
      .site-footer a:hover { text-decoration: underline; }

      /* ── Submit Form Section ── */
      .submit-section {
        width: 100%; max-width: 1100px;
        margin: 0 1rem 2rem;
        animation: fadeUp 0.6s ease-out;
      }
      .submit-section .section-header {
        text-align: center; margin-bottom: 1.25rem;
      }
      .submit-section .section-header h2 {
        font-size: 1.6rem; font-weight: 700; margin: 0 0 0.4rem;
        background: linear-gradient(135deg, #4caf50, #81c784);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .submit-section .section-header p {
        color: #8a9a8e; font-size: 0.95rem; margin: 0;
      }
      .submit-card {
        background: rgba(22, 30, 25, 0.7);
        backdrop-filter: blur(8px);
        border-radius: 16px;
        border: 1px solid rgba(76, 175, 80, 0.12);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        padding: 1.5rem;
      }
      .submit-card iframe {
        border-radius: 10px;
        border: 1px solid rgba(76, 175, 80, 0.1) !important;
      }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        .flex-wrapper { flex-direction: column; }
        #sidebar { width: 100%; }
        #map-container { height: 450px; }
        .container { padding: 1rem; margin: 1rem 0.5rem; }
        .site-header { padding: 0.75rem 1rem; }
        .site-header h1 { font-size: 1.2rem; }
      }

      /* ── Fade-in animation ── */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .container { animation: fadeUp 0.6s ease-out; }
    </style>
</head>
<body>

<header class="site-header">
    <h1><span class="emoji">♻️</span> Doha Recycle Map</h1>
    <a href="#submit-section" class="link-button">📍 Submit a Bin Location</a>
</header>

<div class="container">
    <h1>Doha Recycle Map</h1>
    <p>Find your nearest recycling bin. Search by name or area.</p>

    <div class="flex-wrapper">
        <div id="sidebar">
            <input type="text" id="search-box" placeholder="Search bins by area/name...">
            <ul id="bin-list"></ul>
        </div>
        <div id="map-container">
            <div id="map"></div>
        </div>
    </div>
</div>

<section class="submit-section" id="submit-section">
    <div class="section-header">
        <h2>📍 Found a Recycling Bin?</h2>
        <p>Help grow the map — submit a bin location and it'll appear for everyone.</p>
    </div>
    <div class="submit-card">
        <iframe class="airtable-embed" src="https://airtable.com/embed/appvEcRKGoTkJLKrE/pagxdtAU51R9I2eun/form" frameborder="0" width="100%" height="533" style="background: #1e1e1e; filter: invert(90%) hue-rotate(180deg); border: 1px solid #444;"></iframe>
    </div>
</section>

<footer class="site-footer">
    <p>Built for a greener Doha 🌿 &mdash; <a href="https://airtable.com/appvEcRKGoTkJLKrE/pagxdtAU51R9I2eun/form" target="_blank">Submit a recycling bin</a></p>
</footer>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([25.2854, 51.5310], 12);
    const MAPTILER_API_KEY = 'YTXv7W9S5Ny0T2B8mIjr';
    L.tileLayer('https://api.maptiler.com/maps/hybrid-v4/{z}/{x}/{y}.jpg?key=' + MAPTILER_API_KEY +'&lang=en', {
        attribution: '&copy; MapTiler &copy; OpenStreetMap'
    }).addTo(map);

    const AIRTABLE_BASE_ID = 'appvEcRKGoTkJLKrE';
    const AIRTABLE_TOKEN = 'patKUQIk2cNPuVmrs.c0d9270527a826ca362a2b975d88dd1c2cb1cdf65413fe713d310585f21ab4e8';
    const TABLE_NAME = 'Bins';

    let allBins = [];
    const binList = document.getElementById('bin-list');
    const searchBox = document.getElementById('search-box');

    async function fetchBins() {
        const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(TABLE_NAME)}`;
        const response = await fetch(url, { headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` } });
        const data = await response.json();

        allBins = data.records.map(r => {
            const fields = r.fields;
            const photoData = fields['Photo'];
            let photoHtml = '';

            if (photoData && photoData.length > 0) {
                const photoUrl = photoData[0].thumbnails ? photoData[0].thumbnails.large.url : photoData[0].url;
                photoHtml = `<br><img src="${photoUrl}" class="bin-popup-img" alt="Bin photo">`;
            }

            return {
                id: r.id,
                name: fields['Name'] || 'Unnamed Bin',
                type: fields['Type'] || 'Unknown',
                lat: parseFloat(fields['Latitude']),
                lng: parseFloat(fields['Longitude']),
                photoHtml: photoHtml,
                marker: null
            };
        });

        allBins.forEach(bin => {
            if (!isNaN(bin.lat) && !isNaN(bin.lng)) {
                bin.marker = L.marker([bin.lat, bin.lng]).addTo(map)
                    .bindPopup(`<b>${bin.name}</b><br>Type: ${bin.type}${bin.photoHtml}`);
            }
        });
        renderList(allBins);
    }

    function renderList(bins) {
        binList.innerHTML = '';
        bins.forEach(bin => {
            const li = document.createElement('li');
            li.className = 'bin-item';
            li.textContent = bin.name;
            li.onclick = () => {
                map.setView([bin.lat, bin.lng], 16);
                bin.marker.openPopup();
            };
            binList.appendChild(li);
        });
    }

    searchBox.oninput = (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allBins.filter(b => b.name.toLowerCase().includes(term));
        renderList(filtered);
    };

    fetchBins();
</script>
</body>
</html>
