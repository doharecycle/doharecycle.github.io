name: Update Bins Data

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - 'bins.json'

permissions:
  contents: write

jobs:
  update-bins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Bins from Airtable
        run: |
          curl -s "https://api.airtable.com/v0/appvEcRKGoTkJLKrE/Bins" \
            -H "Authorization: Bearer ${{ secrets.AIRTABLE_TOKEN_ENV }}" \
            > bins.json

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update bins.json from Airtable" && git push)
